<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 800" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrNavy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#012659"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0070C0"/>
    </marker>
    <marker id="arrMid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4F81BD"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1180" height="800" fill="#FFFFFF"/>
  <rect x="4" y="4" width="1172" height="792" fill="none" stroke="#D2D7E1" stroke-width="1.5" rx="6"/>

  <!-- Title -->
  <text x="590" y="32" text-anchor="middle" font-size="24" font-weight="bold" fill="#012659">Split-Team System Architecture</text>
  <text x="590" y="53" text-anchor="middle" font-size="13" fill="#555555">Geo-Spatial Nepali News Engine — CLD 400 (Systems/DevOps) + TECH 400 (Information Retrieval)</text>

  <!-- ================= ARROWS (drawn first, under boxes) ================= -->
  <g stroke-width="2" fill="none">
    <!-- Hardware -> CLD Compute -->
    <line x1="500" y1="607" x2="500" y2="567" stroke="#012659" marker-end="url(#arrNavy)"/>
    <!-- CLD Compute -> Shared Resource Contract -->
    <line x1="500" y1="515" x2="500" y2="475" stroke="#012659" marker-end="url(#arrNavy)"/>
    <!-- Shared Resource Contract -> Ingestion -->
    <line x1="500" y1="423" x2="500" y2="383" stroke="#4F81BD" marker-end="url(#arrMid)"/>
    <!-- Ingestion internal sequence -->
    <line x1="320" y1="358" x2="358" y2="358" stroke="#0070C0" marker-end="url(#arrBlue)"/>
    <line x1="640" y1="358" x2="678" y2="358" stroke="#0070C0" marker-end="url(#arrBlue)"/>
    <!-- Geo-NER fan-out into Processing & Indexing -->
    <line x1="820" y1="335" x2="182" y2="301" stroke="#0070C0" marker-end="url(#arrBlue)"/>
    <line x1="820" y1="335" x2="500" y2="301" stroke="#0070C0" marker-end="url(#arrBlue)"/>
    <line x1="820" y1="335" x2="820" y2="301" stroke="#0070C0" marker-end="url(#arrBlue)"/>
    <!-- Processing & Indexing -> Frontend -->
    <line x1="180" y1="235" x2="255" y2="195" stroke="#0070C0" marker-end="url(#arrBlue)"/>
    <line x1="500" y1="235" x2="260" y2="195" stroke="#0070C0" marker-end="url(#arrBlue)"/>
    <line x1="820" y1="235" x2="745" y2="195" stroke="#0070C0" marker-end="url(#arrBlue)"/>
    <!-- Frontend -> End Users -->
    <line x1="255" y1="145" x2="430" y2="105" stroke="#012659" marker-end="url(#arrNavy)"/>
    <line x1="745" y1="145" x2="570" y2="105" stroke="#012659" marker-end="url(#arrNavy)"/>
    <!-- Frontend -> AWS migration annex -->
    <line x1="960" y1="169" x2="988" y2="180" stroke="#012659" stroke-dasharray="5,4" marker-end="url(#arrNavy)"/>
  </g>

  <!-- Small connector labels -->
  <g font-size="9" font-style="italic" fill="#666666">
    <text x="515" y="590">hosts</text>
    <text x="515" y="498">provisions</text>
    <text x="515" y="406">reads / writes</text>
  </g>

  <!-- ================= END USERS ================= -->
  <rect x="370" y="68" width="260" height="35" rx="6" fill="#012659"/>
  <text x="500" y="82" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">End Users</text>
  <text x="500" y="96" text-anchor="middle" font-size="9" fill="#CBD8EA">Nepali News Readers</text>

  <!-- ================= AWS MIGRATION ANNEX ================= -->
  <rect x="990" y="145" width="170" height="95" rx="6" fill="#F2F2F2" stroke="#012659" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="1075" y="163" text-anchor="middle" font-size="10" font-weight="bold" fill="#012659">Weeks 7-8</text>
  <text x="1075" y="177" text-anchor="middle" font-size="9" fill="#333333">Migrated Production</text>
  <text x="1075" y="189" text-anchor="middle" font-size="9" fill="#333333">Deployment</text>
  <text x="1075" y="203" text-anchor="middle" font-size="8" fill="#555555">AWS: EC2/ECS - S3 -</text>
  <text x="1075" y="214" text-anchor="middle" font-size="8" fill="#555555">RDS+PostGIS - Search</text>
  <text x="1075" y="229" text-anchor="middle" font-size="8.5" font-style="italic" fill="#0070C0">(Public URL)</text>

  <!-- ================= FRONTEND ROW ================= -->
  <rect x="40" y="145" width="430" height="50" rx="6" fill="#FFFFFF" stroke="#0070C0" stroke-width="2"/>
  <text x="255" y="164" text-anchor="middle" font-size="12" font-weight="bold" fill="#012659">Map — Leaflet.js / MapLibre GL</text>
  <text x="255" y="179" text-anchor="middle" font-size="9" fill="#333333">Province &#8594; District &#8594; Municipality Drill-Down</text>
  <text x="255" y="190" text-anchor="middle" font-size="9" fill="#333333">+ Density Heatmaps</text>

  <rect x="530" y="145" width="430" height="50" rx="6" fill="#FFFFFF" stroke="#0070C0" stroke-width="2"/>
  <text x="745" y="167" text-anchor="middle" font-size="12" font-weight="bold" fill="#012659">Search Bar</text>
  <text x="745" y="182" text-anchor="middle" font-size="9" fill="#333333">Cross-Lingual Query — Nepali or English</text>

  <!-- ================= PROCESSING & INDEXING ROW ================= -->
  <rect x="40" y="235" width="280" height="66" rx="6" fill="#FFFFFF" stroke="#0070C0" stroke-width="2"/>
  <text x="180" y="259" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#012659">Spatial Index &amp; Storage</text>
  <text x="180" y="276" text-anchor="middle" font-size="9" fill="#333333">PostGIS - Elasticsearch</text>
  <text x="180" y="289" text-anchor="middle" font-size="9" fill="#333333">Geo-Facets</text>

  <rect x="360" y="235" width="280" height="66" rx="6" fill="#FFFFFF" stroke="#0070C0" stroke-width="2"/>
  <text x="500" y="259" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#012659">GeoJSON Vector Map Layers</text>
  <text x="500" y="276" text-anchor="middle" font-size="9" fill="#333333">7 Provinces - 77 Districts</text>
  <text x="500" y="289" text-anchor="middle" font-size="9" fill="#333333">753 Municipalities</text>

  <rect x="680" y="235" width="280" height="66" rx="6" fill="#FFFFFF" stroke="#0070C0" stroke-width="2"/>
  <text x="820" y="255" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#012659">Hybrid Cross-Lingual</text>
  <text x="820" y="269" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#012659">Search Engine</text>
  <text x="820" y="283" text-anchor="middle" font-size="9" fill="#333333">BM25 + Dense Embeddings + Translation</text>
  <text x="820" y="295" text-anchor="middle" font-size="8.5" font-style="italic" fill="#0070C0">(served by the GPU Inference Node)</text>

  <!-- ================= INGESTION PIPELINE ROW ================= -->
  <rect x="40" y="335" width="280" height="46" rx="6" fill="#FFFFFF" stroke="#0070C0" stroke-width="2"/>
  <text x="180" y="356" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#012659">Distributed Crawler</text>
  <text x="180" y="371" text-anchor="middle" font-size="9" fill="#333333">1,000+ Nepali News Portals</text>

  <rect x="360" y="335" width="280" height="46" rx="6" fill="#FFFFFF" stroke="#0070C0" stroke-width="2"/>
  <text x="500" y="356" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#012659">Devanagari Text &amp;</text>
  <text x="500" y="371" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#012659">Metadata Extraction</text>

  <rect x="680" y="335" width="280" height="46" rx="6" fill="#FFFFFF" stroke="#0070C0" stroke-width="2"/>
  <text x="820" y="356" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#012659">Geographic Entity</text>
  <text x="820" y="371" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#012659">Extraction (Geo-NER)</text>

  <!-- ================= SHARED RESOURCE CONTRACT ROW ================= -->
  <rect x="40" y="423" width="200" height="50" rx="6" fill="#EAF1FA" stroke="#4F81BD" stroke-width="2"/>
  <text x="140" y="444" text-anchor="middle" font-size="11" font-weight="bold" fill="#012659">Ceph / NFS</text>
  <text x="140" y="459" text-anchor="middle" font-size="9" fill="#333333">Object Storage</text>

  <rect x="280" y="423" width="200" height="50" rx="6" fill="#EAF1FA" stroke="#4F81BD" stroke-width="2"/>
  <text x="380" y="444" text-anchor="middle" font-size="11" font-weight="bold" fill="#012659">Redis / Kafka</text>
  <text x="380" y="459" text-anchor="middle" font-size="9" fill="#333333">URL Frontier Queue</text>

  <rect x="520" y="423" width="200" height="50" rx="6" fill="#EAF1FA" stroke="#4F81BD" stroke-width="2"/>
  <text x="620" y="444" text-anchor="middle" font-size="11" font-weight="bold" fill="#012659">PostgreSQL + PostGIS</text>
  <text x="620" y="459" text-anchor="middle" font-size="9" fill="#333333">(Master-Replica)</text>

  <rect x="760" y="423" width="200" height="50" rx="6" fill="#EAF1FA" stroke="#4F81BD" stroke-width="2"/>
  <text x="860" y="444" text-anchor="middle" font-size="11" font-weight="bold" fill="#012659">Elasticsearch / Qdrant</text>
  <text x="860" y="459" text-anchor="middle" font-size="9" fill="#333333">(Multi-Node, Sharded)</text>

  <!-- ================= CLD 400 COMPUTE & VIRTUALIZATION ROW ================= -->
  <rect x="40" y="515" width="200" height="50" rx="6" fill="#FFFFFF" stroke="#012659" stroke-width="2"/>
  <text x="140" y="536" text-anchor="middle" font-size="11" font-weight="bold" fill="#012659">Hypervisors</text>
  <text x="140" y="551" text-anchor="middle" font-size="9" fill="#333333">Proxmox VE / VMware ESXi</text>

  <rect x="280" y="515" width="200" height="50" rx="6" fill="#FFFFFF" stroke="#012659" stroke-width="2"/>
  <text x="380" y="536" text-anchor="middle" font-size="11" font-weight="bold" fill="#012659">Networking &amp; HA</text>
  <text x="380" y="550" text-anchor="middle" font-size="8.5" fill="#333333">VLAN - LACP - Keepalived</text>
  <text x="380" y="561" text-anchor="middle" font-size="8.5" fill="#333333">HAProxy - MetalLB</text>

  <rect x="520" y="515" width="200" height="50" rx="6" fill="#FFFFFF" stroke="#012659" stroke-width="2"/>
  <text x="620" y="536" text-anchor="middle" font-size="11" font-weight="bold" fill="#012659">GPU Inference Node</text>
  <text x="620" y="551" text-anchor="middle" font-size="9" fill="#333333">CUDA / cuDNN</text>

  <rect x="760" y="515" width="200" height="50" rx="6" fill="#FFFFFF" stroke="#012659" stroke-width="2"/>
  <text x="860" y="536" text-anchor="middle" font-size="11" font-weight="bold" fill="#012659">Bare-Metal Kubernetes</text>
  <text x="860" y="551" text-anchor="middle" font-size="9" fill="#333333">K3s + NVIDIA Device Plugin</text>

  <!-- ================= HARDWARE FOUNDATION ================= -->
  <rect x="40" y="607" width="920" height="38" rx="6" fill="#012659"/>
  <text x="500" y="631" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">Physical Server Hardware — College Hardware Lab</text>

  <!-- ================= LEGEND ================= -->
  <text x="40" y="672" font-size="11" font-weight="bold" fill="#012659">Legend</text>
  <rect x="40" y="680" width="16" height="16" rx="3" fill="#FFFFFF" stroke="#012659" stroke-width="2"/>
  <text x="62" y="692" font-size="10.5" fill="#333333">CLD 400 — Systems / DevOps (owns this component)</text>

  <rect x="40" y="702" width="16" height="16" rx="3" fill="#FFFFFF" stroke="#0070C0" stroke-width="2"/>
  <text x="62" y="714" font-size="10.5" fill="#333333">TECH 400 — Information Retrieval (owns this component)</text>

  <rect x="40" y="724" width="16" height="16" rx="3" fill="#EAF1FA" stroke="#4F81BD" stroke-width="2"/>
  <text x="62" y="736" font-size="10.5" fill="#333333">Shared Resource Contract — managed by CLD 400, consumed by TECH 400</text>

  <rect x="40" y="746" width="16" height="16" rx="3" fill="#F2F2F2" stroke="#012659" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="62" y="758" font-size="10.5" fill="#333333">AWS Migration Target — final production hosting, Weeks 7-8</text>

  <!-- Footer -->
  <text x="590" y="787" text-anchor="middle" font-size="9.5" fill="#888888">Combined Syllabus — CLD 400 (Virtualization &amp; Storage) + TECH 400 (Introduction to Information Retrieval) - Westcliff University / Presidential Graduate School</text>
</svg>
