# Reverse proxy in front of the Next.js UI (the `nginx` service of the root
# docker-compose.yml). Answers for any host name, so http://localhost and any domain
# whose DNS points at this machine both reach the UI. It listens on port 80, inside
# the Docker network as well (http://nginx); compose publishes it as host port
# HTTP_PORT (80). nginx runs as a non-root user: compose lets the container bind
# ports below 1024 (net.ipv4.ip_unprivileged_port_start=0) instead of running it as root.

# Docker's embedded DNS: `ui` is re-resolved while running, so a restarted UI
# container (new IP) is picked up without restarting nginx, and nginx starts even
# before the UI is up.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream ui {
    zone ui 64k;
    server ui:3000 resolve;
    keepalive 16;
}

# WebSocket upgrades pass through; everything else keeps the connection alive.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    server_tokens off;
    client_max_body_size 10m;

    # Liveness of nginx itself (compose healthcheck); not proxied.
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Next's hashed build assets never change for a given file name.
    location /_next/static/ {
        proxy_pass http://ui;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://ui;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
    }
}
