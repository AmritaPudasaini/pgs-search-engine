[tool.ruff]
line-length = 100
target-version = "py311"
src = ["api", "database/src", "search-engine/src"]
extend-exclude = ["search-engine/src/pgs_search/grpc/generated"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]

[tool.ruff.lint.isort]
known-first-party = ["pgs_db", "pgs_search"]

[tool.pyright]
include = ["api", "database/src"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"
pythonVersion = "3.11"
