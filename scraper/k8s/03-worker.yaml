apiVersion: v1
kind: ConfigMap
metadata:
  name: worker-config
  namespace: search-engine-scraper
data:
  # Assumes Temporal server was installed via the official Helm chart
  # (`helm install temporal temporalio/temporal -n temporal`) -- this repo
  # doesn't hand-roll Temporal server manifests, since the Helm chart is
  # the maintained, correct way to run it in Kubernetes. Adjust if your
  # Temporal frontend lives elsewhere (different namespace, Temporal
  # Cloud, etc).
  TEMPORAL_ADDRESS: "temporal-frontend.temporal.svc.cluster.local:7233"
  NAMESPACE: "default"
  STORAGE: "postgres"
  # Uncomment to also fan out every crawled document to the ETL team's
  # Kafka cluster (see internal/storage/kafka_writer.go) alongside Postgres:
  # KAFKA_BROKERS: "kafka-0.kafka.svc.cluster.local:9092"
  # KAFKA_TOPIC: "crawled-documents"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: search-engine-scraper
spec:
  replicas: 3 # horizontal scale-out: each pod is an independent Temporal worker on the same task queue, no coordination needed between them
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: search-engine-scraper-worker:latest # build & push with your own registry; see README
          envFrom:
            - configMapRef:
                name: worker-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: DATABASE_URL
            # MAX_CONCURRENT_ACTIVITIES is intentionally unset: the binary
            # defaults it to NumCPU * 100 using the CPU limit below (via
            # automaxprocs), so raising `resources.limits.cpu` alone raises
            # per-pod concurrency without touching this manifest again.
          resources:
            requests:
              cpu: "500m"
              memory: "128Mi"
            limits:
              cpu: "2"
              memory: "512Mi"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: worker
  namespace: search-engine-scraper
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: worker
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
