# Host-sharded alternative to the `worker` Deployment in 03-worker.yaml:
# one StatefulSet pod per shard, each owning the hosts that hash to its
# shard, so a given domain is only ever fetched by a single pod (and its
# rate limit, Crawl-delay, robots.txt cache and DNS cache live in that one
# process). Use this OR the Deployment, not both.
#
# Pod ordinal -> shard: worker-sharded-2 polls shard 2 (SHARD_FROM_HOSTNAME).
# Keep TASK_QUEUE_SHARDS equal to `replicas`, and start crawls with
# `--task-queue-shards=<same number>`. To resize, change both together; hosts
# are re-hashed across the new shard count.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: worker-sharded
  namespace: search-engine-scraper
spec:
  serviceName: worker-sharded
  replicas: 8
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: worker-sharded
  template:
    metadata:
      labels:
        app: worker-sharded
    spec:
      containers:
        - name: worker
          image: search-engine-scraper-worker:latest
          envFrom:
            - configMapRef:
                name: worker-config
          env:
            - name: TASK_QUEUE_SHARDS
              value: "8"
            - name: SHARD_FROM_HOSTNAME
              value: "true"
          resources:
            requests:
              cpu: "500m"
              memory: "128Mi"
            limits:
              cpu: "2"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: worker-sharded
  namespace: search-engine-scraper
spec:
  clusterIP: None
  selector:
    app: worker-sharded
  ports:
    - name: metrics
      port: 9090
