version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/db/queries.sql"
    # Generated by database/scripts/export_scraper_schema.py from the pgs_db models (the
    # source of truth). Read only to generate the Go models; the scraper migrates nothing.
    schema: "../database/sql/scraper_schema.sql"
    gen:
      go:
        package: "db"
        out: "internal/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
