name: search-engine-scraper

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-multiple-databases.sh:/docker-entrypoint-initdb.d/init-multiple-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Applies migrations/*.sql to the app's `scraper` database, then exits.
  # `worker` waits on this completing successfully before it starts.
  migrate:
    image: migrate/migrate:v4.19.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    entrypoint:
      [
        "migrate", "-path", "/migrations",
        "-database", "postgres://temporal:temporal@postgres:5432/scraper?sslmode=disable",
        "up",
      ]

  # Temporal's own persistence, in the sibling `temporal` database on the
  # same postgres instance (temporalio/auto-setup creates its own schema).
  temporal:
    image: temporalio/auto-setup:1.24.2
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=postgres
    ports:
      - "7233:7233"
    restart: unless-stopped

  # Single-node Kafka-API-compatible broker (Redpanda: no Zookeeper, no JVM,
  # trivial to run locally) -- the hand-off point to the ETL team's
  # pipeline. Run the worker with STORAGE=kafka to publish crawled
  # documents here instead of/alongside Postgres; the ETL side consumes the
  # `crawled-documents` topic (see internal/storage/kafka_writer.go).
  kafka:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://kafka:9092
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  temporal-ui:
    image: temporalio/ui:2.31.2
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:8233
    ports:
      - "8233:8080"
    restart: unless-stopped

  # The Temporal worker: this is what actually fetches pages. Scale it with
  # `docker compose up --build --scale worker=N` (see the Makefile's
  # `make scale N=...` target) -- each replica independently connects to
  # the same Temporal task queue and the same Postgres, so they load-balance
  # automatically with no coordination between them.
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    depends_on:
      migrate:
        condition: service_completed_successfully
      temporal:
        condition: service_started
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - STORAGE=postgres
      - DATABASE_URL=postgres://temporal:temporal@postgres:5432/scraper?sslmode=disable
      # MAX_CONCURRENT_ACTIVITIES is left unset here on purpose: the binary
      # defaults it to NumCPU * 100, which respects this container's CPU
      # limit (see Dockerfile.worker's automaxprocs import) -- set it
      # explicitly only to override that.
    # `depends_on: temporal: service_started` only waits for the temporal
    # container process to start, not for its gRPC server to actually be
    # accepting connections (auto-setup runs schema setup first) -- the
    # worker's own client.Dial can lose that race and exit. restart:
    # on-failure self-heals that within a few seconds instead of needing a
    # wait-for-it script.
    restart: on-failure

  # Read-only HTTP API + Swagger UI over the documents table. Browse
  # http://localhost:8080/docs to preview crawled data and try the
  # endpoints; it doesn't start crawls itself (see `scraper` below).
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      - DATABASE_URL=postgres://temporal:temporal@postgres:5432/scraper?sslmode=disable
    ports:
      - "8080:8080"
    restart: unless-stopped

  # Not started by `docker compose up` (see `profiles` below) -- it's a
  # one-shot client, not a long-running service. Run it with:
  #   docker compose run --rm scraper --seeds=https://example.com
  scraper:
    build:
      context: .
      dockerfile: Dockerfile.scraper
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    profiles: ["tools"]

volumes:
  pgdata:
