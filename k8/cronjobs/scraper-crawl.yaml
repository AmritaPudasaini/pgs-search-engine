apiVersion: batch/v1
kind: CronJob
metadata:
  name: scraper-crawl
  labels:
    app.kubernetes.io/name: scraper-crawl
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid # don't start the next crawl while one is still being started
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            app.kubernetes.io/name: scraper-crawl
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          enableServiceLinks: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: scraper
              image: pgs-search-engine/scraper-cli
              imagePullPolicy: IfNotPresent
              # Seed lists baked into the image: /configs/seeds.example.txt, seeds.sample.txt
              args:
                - "--seeds-file=/configs/seeds.example.txt"
                - "--max-depth=2"
                - "--max-pages=200"
                - "--max-pages-per-domain=50"
                - "--same-host-only=false"
              envFrom:
                - configMapRef:
                    name: scraper-config
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              resources:
                requests: { cpu: 20m, memory: 32Mi }
                limits: { memory: 128Mi }
