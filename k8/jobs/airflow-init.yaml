# Migrates Airflow's metadata database and creates the admin login (both idempotent).
# The image's entrypoint waits for airflow-db before running the command. Deletes itself
# 10 minutes after finishing, so each `kubectl apply` re-runs it (e.g. after an upgrade).
apiVersion: batch/v1
kind: Job
metadata:
  name: airflow-init
  labels:
    app.kubernetes.io/name: airflow-init
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: airflow-init
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 50000
        runAsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: airflow-init
          image: pgs-search-engine/etl
          imagePullPolicy: IfNotPresent
          args:
            - bash
            - -c
            - |
              set -e
              airflow db migrate
              airflow users create \
                --username "$AIRFLOW_ADMIN_USERNAME" \
                --password "$AIRFLOW_ADMIN_PASSWORD" \
                --firstname Air \
                --lastname Flow \
                --role Admin \
                --email admin@example.com || true
          envFrom:
            - configMapRef:
                name: airflow-config
          env:
            - name: AIRFLOW_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: pgs-secrets, key: AIRFLOW_DB_PASSWORD }
            - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
              value: postgresql+psycopg2://airflow:$(AIRFLOW_DB_PASSWORD)@airflow-db/airflow
            - name: AIRFLOW__CORE__FERNET_KEY
              valueFrom:
                secretKeyRef: { name: pgs-secrets, key: AIRFLOW_FERNET_KEY }
            - name: AIRFLOW_ADMIN_USERNAME
              valueFrom:
                secretKeyRef: { name: pgs-secrets, key: AIRFLOW_ADMIN_USERNAME }
            - name: AIRFLOW_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: pgs-secrets, key: AIRFLOW_ADMIN_PASSWORD }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { memory: 1Gi }
