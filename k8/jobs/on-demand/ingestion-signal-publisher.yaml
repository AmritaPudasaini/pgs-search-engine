# Publishes one file-ready signal (ETL/airflow/data/local_dfs_store/sample.html, baked into
# the ETL image) to scraped_files_topic for the etl_ingestion_pipeline DAG:
#   kubectl create -f k8/jobs/on-demand/ingestion-signal-publisher.yaml
apiVersion: batch/v1
kind: Job
metadata:
  generateName: ingestion-signal-publisher-
  namespace: pgs-search-engine
  labels:
    app.kubernetes.io/name: ingestion-signal-publisher
    app.kubernetes.io/part-of: pgs-search-engine
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ingestion-signal-publisher
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 50000
        runAsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: publish
          image: pgs-search-engine/etl:local
          imagePullPolicy: IfNotPresent
          command:
            - /usr/bin/dumb-init
            - --
            - python
            - -c
            - |
              from kafka import KafkaProducer
              import json

              signal = {
                  "bucket": "etl-file-store",
                  "object_key": "sample.html",
                  "target_domain": "example.gov.np",
                  "source_url": "https://example.gov.np/notices/sample",
                  "title": "Sample Municipality Notice",
                  "content_type": "text/html",
              }
              producer = KafkaProducer(
                  bootstrap_servers=["kafka:29092"],
                  key_serializer=lambda key: key.encode("utf-8"),
                  value_serializer=lambda value: json.dumps(value).encode("utf-8"),
              )
              producer.send("scraped_files_topic", key=signal["target_domain"], value=signal)
              producer.flush()
              print("Sent 1 file-ready ingestion signal to scraped_files_topic")
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
