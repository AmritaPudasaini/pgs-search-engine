# Bulk-indexes the ETL DAG's JSONL output (etl-processed volume) into OpenSearch, index
# pgs_documents (created on first run):
#   kubectl create -f k8/jobs/on-demand/opensearch-indexer.yaml
apiVersion: batch/v1
kind: Job
metadata:
  generateName: opensearch-indexer-
  namespace: pgs-search-engine
  labels:
    app.kubernetes.io/name: opensearch-indexer
    app.kubernetes.io/part-of: pgs-search-engine
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opensearch-indexer
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 50000
        runAsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: indexer
          image: pgs-search-engine/etl:local
          imagePullPolicy: IfNotPresent
          command: ["/usr/bin/dumb-init", "--", "/opt/etl-venv/bin/python", "-m", "opensearch.index_documents"]
          workingDir: /opt/etl/OpenSearch
          env:
            - { name: OPENSEARCH_URL, value: "http://opensearch:9200" }
            - { name: OPENSEARCH_INDEX, value: pgs_documents }
            - { name: JSONL_PATH, value: /data/processed/transformed_documents.jsonl }
          volumeMounts:
            - name: processed
              mountPath: /data/processed
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
      volumes:
        - name: processed
          persistentVolumeClaim:
            claimName: etl-processed
