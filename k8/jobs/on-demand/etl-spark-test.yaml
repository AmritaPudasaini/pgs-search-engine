# Standalone Spark check (ETL/spark/test_spark.py, no Airflow):
#   kubectl create -f k8/jobs/on-demand/etl-spark-test.yaml
apiVersion: batch/v1
kind: Job
metadata:
  generateName: etl-spark-test-
  namespace: pgs-search-engine
  labels:
    app.kubernetes.io/name: etl-spark-test
    app.kubernetes.io/part-of: pgs-search-engine
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: etl-spark-test
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 50000
        runAsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: spark-test
          image: pgs-search-engine/etl:local
          imagePullPolicy: IfNotPresent
          command: ["/usr/bin/dumb-init", "--", "python", "test_spark.py"]
          workingDir: /opt/airflow/spark_lib
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 2Gi }
