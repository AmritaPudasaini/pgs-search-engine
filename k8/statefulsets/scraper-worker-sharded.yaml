apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: scraper-worker-sharded
  labels:
    app.kubernetes.io/name: scraper-worker-sharded
spec:
  serviceName: scraper-worker-sharded
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: scraper-worker-sharded
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scraper-worker-sharded
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-temporal
          image: temporalio/auto-setup:1.24.2
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until temporal operator namespace describe --namespace default --address temporal:7233 > /dev/null 2>&1; do
                echo "waiting for temporal"; sleep 5
              done
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
      containers:
        - name: worker
          image: pgs-search-engine/scraper-worker
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 9090
          envFrom:
            - configMapRef:
                name: scraper-config
          env:
            - { name: TASK_QUEUE_SHARDS, value: "3" }
            - { name: SHARD_FROM_HOSTNAME, value: "true" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 250m, memory: 128Mi }
            limits: { cpu: "2", memory: 512Mi }
