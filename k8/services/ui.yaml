# Next.js UI. From the host:
#   kubectl -n pgs-search-engine port-forward svc/ui 3000:3000
# NEXT_PUBLIC_API_BASE_URL is baked in at image build time (a host URL, e.g. the API's
# port-forward on http://localhost:8000).
apiVersion: v1
kind: Service
metadata:
  name: ui
  labels:
    app.kubernetes.io/name: ui
spec:
  selector:
    app.kubernetes.io/name: ui
  ports:
    - name: http
      port: 3000
      targetPort: http
