# From the host:
#   kubectl -n pgs-search-engine port-forward svc/opensearch-dashboards 5601:5601
apiVersion: v1
kind: Service
metadata:
  name: opensearch-dashboards
  labels:
    app.kubernetes.io/name: opensearch-dashboards
spec:
  selector:
    app.kubernetes.io/name: opensearch-dashboards
  ports:
    - name: http
      port: 5601
      targetPort: http
