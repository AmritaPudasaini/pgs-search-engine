# API gateway (image: api/Dockerfile). Reach it from the host with
#   kubectl -n pgs-search-engine port-forward svc/api 8000:8000
apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
spec:
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: 8000
      targetPort: http
