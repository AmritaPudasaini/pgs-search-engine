apiVersion: v1
kind: Namespace
metadata:
  name: pgs-search-engine
  labels:
    # PostgreSQL, ClamAV, LocalStack and Chrome images start as root and drop privileges
    # themselves, so the namespace enforces `baseline`; the project's own workloads also
    # meet `restricted`, which is reported as warnings for anything that doesn't.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
