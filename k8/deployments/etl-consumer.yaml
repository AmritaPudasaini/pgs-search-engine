# ETL Kafka consumer: kafka/consumer.py on `crawled-documents`, run with the pgs-db
# interpreter (/opt/etl-venv) so the PostgreSQL write path (pgs_db.etl) is available.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: etl-consumer
  labels:
    app.kubernetes.io/name: etl-consumer
spec:
  replicas: 1
  strategy:
    type: Recreate # the SQLite receipts volume is ReadWriteOnce, single writer
  selector:
    matchLabels:
      app.kubernetes.io/name: etl-consumer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: etl-consumer
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        fsGroup: 0 # the Airflow image's group, so the volume is writable for uid 50000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-topic
          image: apache/kafka:3.8.0
          imagePullPolicy: IfNotPresent
          command:
            - bash
            - -c
            - |
              until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --describe --topic crawled-documents > /dev/null 2>&1; do
                echo "waiting for kafka-init"; sleep 5
              done
          env:
            - { name: KAFKA_HEAP_OPTS, value: "-Xmx128m" }
          securityContext:
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 50m, memory: 192Mi }
            limits: { memory: 384Mi }
        - name: wait-for-database
          image: pgs-search-engine/postgres
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until [ "$(psql -h postgres -U pgs_etl -d "$POSTGRES_DB" -tAc 'SELECT count(*) FROM local_bodies' 2>/dev/null)" = "753" ]; do
                echo "waiting for db-bootstrap"; sleep 5
              done
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef: { name: pgs-secrets, key: POSTGRES_DB }
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: { name: pgs-secrets, key: PGS_ETL_DB_PASSWORD }
          securityContext:
            runAsUser: 999
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 64Mi }
      containers:
        - name: consumer
          image: pgs-search-engine/etl
          imagePullPolicy: IfNotPresent
          # dumb-init (from the Airflow image) as PID 1 forwards SIGTERM, which the consumer
          # handles before committing offsets. Airflow's own entrypoint is bypassed.
          command: ["/usr/bin/dumb-init", "--", "/opt/etl-venv/bin/python", "consumer.py", "consume"]
          workingDir: /opt/etl/kafka
          envFrom:
            - configMapRef:
                name: pgs-config
          env:
            - { name: KAFKA_TOPIC, value: crawled-documents }
            - { name: KAFKA_GROUP, value: search-engine-etl-v1 }
            - { name: ETL_DATABASE, value: /data/etl.sqlite3 }
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef: { name: pgs-secrets, key: POSTGRES_DB }
            - name: PGS_ETL_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: pgs-secrets, key: PGS_ETL_DB_PASSWORD }
            - name: DATABASE_URL
              value: postgresql+psycopg://pgs_etl:$(PGS_ETL_DB_PASSWORD)@postgres:5432/$(POSTGRES_DB)
            - { name: DB_APPLICATION_NAME, value: pgs-etl-consumer }
          volumeMounts:
            - name: data
              mountPath: /data
          securityContext:
            runAsUser: 50000
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: etl-consumer-data
