# Read-only documents API + Swagger UI over the bucket. From the host:
#   kubectl -n pgs-search-engine port-forward svc/scraper-api 8082:8080   (then /docs)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scraper-api
  labels:
    app.kubernetes.io/name: scraper-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: scraper-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scraper-api
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: pgs-search-engine/scraper-api
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: scraper-config
          readinessProbe:
            httpGet:
              path: /docs
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 256Mi }
