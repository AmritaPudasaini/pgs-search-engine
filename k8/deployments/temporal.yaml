apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal
  labels:
    app.kubernetes.io/name: temporal
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: temporal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: temporal
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      # Runs as the image's own (named) `temporal` user.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: temporal
          image: temporalio/auto-setup:1.24.2
          imagePullPolicy: IfNotPresent
          ports:
            - name: frontend
              containerPort: 7233
          env:
            - { name: DB, value: postgres12 }
            - { name: DB_PORT, value: "5432" }
            - { name: POSTGRES_SEEDS, value: temporal-db }
            - { name: POSTGRES_USER, value: temporal }
            - name: POSTGRES_PWD
              valueFrom:
                secretKeyRef: { name: pgs-secrets, key: TEMPORAL_DB_PASSWORD }
          # Ready once the `default` namespace the worker and client use exists. The
          # frontend binds to the pod IP, not localhost.
          readinessProbe:
            exec:
              command: ["sh", "-c", "temporal operator namespace describe --namespace default --address $(hostname -i):7233 > /dev/null 2>&1"]
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 10
          livenessProbe:
            tcpSocket:
              port: frontend
            initialDelaySeconds: 120
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { memory: 1Gi }
