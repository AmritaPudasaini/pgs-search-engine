apiVersion: apps/v1
kind: Deployment
metadata:
  name: clamav
  labels:
    app.kubernetes.io/name: clamav
spec:
  replicas: 1
  strategy:
    type: Recreate # one pod owns the ReadWriteOnce signature volume
  selector:
    matchLabels:
      app.kubernetes.io/name: clamav
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clamav
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: clamav
          # Starts as root and drops to the clamav user itself (hence namespace `baseline`).
          image: clamav/clamav:1.4
          imagePullPolicy: IfNotPresent
          ports:
            - name: clamd
              containerPort: 3310
          volumeMounts:
            - name: signatures
              mountPath: /var/lib/clamav
          startupProbe:
            exec:
              command: ["clamdcheck.sh"]
            periodSeconds: 15
            failureThreshold: 40 # up to 10 minutes for the first signature download
          readinessProbe:
            exec:
              command: ["clamdcheck.sh"]
            periodSeconds: 30
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command: ["clamdcheck.sh"]
            periodSeconds: 60
            timeoutSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 1Gi }
            limits: { memory: 2Gi }
      volumes:
        - name: signatures
          persistentVolumeClaim:
            claimName: clamav-db
