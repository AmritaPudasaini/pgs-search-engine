apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-engine
  labels:
    app.kubernetes.io/name: search-engine
spec:
  replicas: 1
  strategy:
    type: Recreate # one pod owns the model cache volume
  selector:
    matchLabels:
      app.kubernetes.io/name: search-engine
  template:
    metadata:
      labels:
        app.kubernetes.io/name: search-engine
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Creates the OpenSearch index with its mapping (a no-op when it exists); compose's
        # search-index-init. Retries until OpenSearch answers.
        - name: create-index
          image: pgs-search-engine/search-engine
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - until python scripts/create_index.py; do echo "waiting for opensearch"; sleep 5; done
          env:
            - { name: OPENSEARCH_HOST, value: opensearch }
            - { name: OPENSEARCH_PORT, value: "9200" }
            - { name: OPENSEARCH_INDEX, value: np_web_pages }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { memory: 1Gi }
        - name: wait-for-database
          image: pgs-search-engine/postgres
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until [ "$(psql -h postgres -U pgs_search -d "$POSTGRES_DB" -tAc 'SELECT count(*) FROM local_bodies' 2>/dev/null)" = "753" ]; do
                echo "waiting for db-bootstrap"; sleep 5
              done
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef: { name: pgs-secrets, key: POSTGRES_DB }
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: { name: pgs-secrets, key: PGS_SEARCH_DB_PASSWORD }
          securityContext:
            runAsUser: 999
            runAsGroup: 999
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 64Mi }
      containers:
        - name: search-engine
          image: pgs-search-engine/search-engine
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 50051
          # Not pgs-config: there SEARCH_GRPC_HOST is the client-side address, while this
          # server reads it as its bind address.
          env:
            - { name: SEARCH_GRPC_HOST, value: 0.0.0.0 }
            - { name: SEARCH_GRPC_PORT, value: "50051" }
            - { name: OPENSEARCH_HOST, value: opensearch }
            - { name: OPENSEARCH_PORT, value: "9200" }
            - { name: OPENSEARCH_INDEX, value: np_web_pages }
            # vector_search/config.py (psycopg2) and pgs_db (DATABASE_URL), both as pgs_search
            - { name: POSTGRES_HOST, value: postgres }
            - { name: POSTGRES_PORT, value: "5432" }
            - { name: POSTGRES_USER, value: pgs_search }
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef: { name: pgs-secrets, key: POSTGRES_DB }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: pgs-secrets, key: PGS_SEARCH_DB_PASSWORD }
            - name: DATABASE_URL
              value: postgresql+psycopg://pgs_search:$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)
            - { name: DB_APPLICATION_NAME, value: pgs-search }
          volumeMounts:
            - name: models
              mountPath: /home/app/.cache/huggingface
          # The server binds its port only after loading every model; the first start
          # downloads them, so allow up to 30 minutes.
          startupProbe:
            tcpSocket:
              port: grpc
            periodSeconds: 15
            failureThreshold: 120
          readinessProbe:
            tcpSocket:
              port: grpc
            periodSeconds: 15
          livenessProbe:
            tcpSocket:
              port: grpc
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 500m, memory: 3Gi }
            limits: { memory: 4Gi }
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: search-models
