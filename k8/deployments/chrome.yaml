apiVersion: apps/v1
kind: Deployment
metadata:
  name: chrome
  labels:
    app.kubernetes.io/name: chrome
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: chrome
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chrome
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: chrome
          image: chromedp/headless-shell:151.0.7922.109
          imagePullPolicy: IfNotPresent
          ports:
            - name: devtools
              containerPort: 9222
          volumeMounts:
            - name: shm # Chrome needs a large /dev/shm (compose: shm_size 1gb)
              mountPath: /dev/shm
          readinessProbe:
            tcpSocket:
              port: devtools
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: devtools
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { memory: 2Gi }
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
