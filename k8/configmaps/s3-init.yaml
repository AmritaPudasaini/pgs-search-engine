# S3 for the crawler (LocalStack, S3 only) and a browser for the bucket. LocalStack keeps
# no state across restarts. For real S3, drop S3_ENDPOINT and the test credentials from
# configmaps/scraper-config.yaml and give the pods real credentials instead.
#   kubectl -n pgs-search-engine port-forward svc/s3 4566:4566
#   kubectl -n pgs-search-engine port-forward svc/s3-browser 8081:8080
apiVersion: v1
kind: ConfigMap
metadata:
  name: s3-init
  labels:
    app.kubernetes.io/name: s3
data:
  # Same as the s3-create-bucket config in docker-compose.yml: LocalStack runs ready.d hooks
  # once S3 is up.
  init-s3-bucket.sh: |
    #!/bin/sh
    awslocal s3 mb s3://crawled-pages
