[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pgs-db"
version = "0.1.0"
description = "Shared, framework-independent database models (SQLAlchemy) and schemas (Pydantic) for the PGS Search Engine"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "SQLAlchemy>=2.0",
    "pydantic>=2.0",
    "alembic>=1.13",
    "pgvector>=0.3",  # page_embeddings.embedding
    "geoalchemy2>=0.15",  # provinces/districts/local_bodies.boundary (PostGIS)
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
auth = ["argon2-cffi>=23.1"]  # pgs_db.security, scripts/create_admin.py
s3 = ["boto3>=1.34"]  # pgs_db.ingest: the scraper's S3 bucket -> Bronze
dev = ["pytest>=8.0", "argon2-cffi>=23.1"]

[tool.setuptools.packages.find]
where = ["src"]

# Ship the PEP 561 marker so strict type checkers in consuming services
# (api/, ETL tooling) see pgs_db as a typed package instead of Unknown.
[tool.setuptools.package-data]
pgs_db = ["py.typed"]
