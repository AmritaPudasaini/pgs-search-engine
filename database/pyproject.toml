[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pgs-db"
version = "0.1.0"
description = "Shared, framework-independent database models (SQLAlchemy) and schemas (Pydantic) for the PGS Search Engine"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "SQLAlchemy>=2.0",
    "pydantic>=2.0",
    "alembic>=1.13",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

# Ship the PEP 561 marker so strict type checkers in consuming services
# (api/, ETL tooling) see pgs_db as a typed package instead of Unknown.
[tool.setuptools.package-data]
pgs_db = ["py.typed"]
