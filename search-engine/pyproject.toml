[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pgs-search"
version = "0.1.0"
description = "Search Engine Core for PGS"
requires-python = ">=3.11"
dependencies = [
    "opensearch-py>=3.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "grpcio>=1.84.0",
    "grpcio-tools>=1.84.0",
    "protobuf>=7.35.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.16",
    "pyright>=1.1",
]

[tool.setuptools.packages.find]
where = ["src"]
