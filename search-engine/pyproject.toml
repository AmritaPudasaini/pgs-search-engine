[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pgs-search"
version = "0.1.0"
description = "Search Engine Core for PGS"
requires-python = ">=3.11"
shreya/bilingual-query-normalization
search-engine
dependencies = [
    "opensearch-py>=3.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
shreya/bilingual-query-normalization
    "nltk>=3.7",
    "sentence-transformers>=3.0",
    "scikit-learn>=1.0",
    "joblib>=1.3",
    "transformers>=4.40",
    "torch>=2.0",
    "sentencepiece>=0.1.99",
    "grpcio>=1.84.0",
    "grpcio-tools>=1.84.0",
    "protobuf>=7.35.1",
search-engine
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.16",
    "pyright>=1.1",
]

[tool.setuptools.packages.find]
where = ["src"]
shreya/bilingual-query-normalization

[tool.setuptools.package-data]
pgs_search = ["query/data/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
    "slow: integration tests that load the real Nepali lemmatization pipeline",
]

[tool.ruff]
line-length = 100
target-version = "py311"
search-engine
