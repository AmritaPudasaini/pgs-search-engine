# PGS Search Engine -- the whole stack, from the repository root.
#
#   cp .env.example .env        # once; then adjust (AIRFLOW_UID, passwords, ports)
#   docker compose up -d --build
#
# Startup order (enforced with health checks and depends_on conditions, no sleeps):
#
#   postgres ─► db-migrate ─┬─► db-seed ─────────┐
#                           └─► db-role-passwords ┴─► api, etl-consumer, airflow-worker
#   kafka ─► kafka-init ──────────────────────────────► etl-consumer, airflow-worker,
#                                                        scraper-worker
#   opensearch ─► (search-index-init) ─► api, search-engine
#   airflow-db + redis ─► airflow-init ─► airflow-webserver / -scheduler / -worker
#   temporal-db ─► temporal ─► temporal-ui, scraper-worker, scraper-cli;  s3 ─► scraper-*
#
# Optional services are grouped in profiles, enabled with --profile or COMPOSE_PROFILES:
#   search           gRPC search engine + index init (~3 GB RAM, ~2.5 GB model download)
#   scraper          Go crawler: Temporal (+UI), LocalStack S3 (+browser), headless
#                    Chrome, worker, documents API
#   scraper-sharded  three host-sharded crawler workers (instead of scaling one)
#   ui               Next.js UI (its build needs ui/src/lib + deps missing from the repo)
#   tools            OpenSearch Dashboards, OpenSearch indexer, Kafka signal publisher,
#                    standalone Spark check
# One-shot clients are run on demand, e.g. `docker compose run --rm scraper-cli --seeds=...`.
#
# Containers reach each other by service name (postgres:5432, kafka:29092,
# opensearch:9200, ...). Ports published to the host are bound to 127.0.0.1 only.

name: pgs-search-engine

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

# ---------------------------------------------------------------------------------
# ETL image (ETL/Dockerfile): Airflow, PySpark and the Kafka consumer
# ---------------------------------------------------------------------------------
x-etl-build: &etl-build
  build:
    context: .
    dockerfile: ETL/Dockerfile
  image: pgs-search-engine/etl:local

x-airflow-common: &airflow-common
  <<: *etl-build
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:?set AIRFLOW_DB_PASSWORD in .env}@airflow-db/airflow
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:${AIRFLOW_DB_PASSWORD}@airflow-db/airflow
    AIRFLOW__CELERY__BROKER_URL: redis://:@redis:6379/0
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:?set AIRFLOW_SECRET_KEY in .env}
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    # Local-development sizing (Airflow defaults: 4 webserver workers, 16 task slots).
    AIRFLOW__WEBSERVER__WORKERS: ${AIRFLOW_WEBSERVER_WORKERS:-2}
    AIRFLOW__CELERY__WORKER_CONCURRENCY: ${AIRFLOW_WORKER_CONCURRENCY:-4}
    # Leave newly added DAGs unpaused (as the ETL team runs them).
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    # For DAG tasks (the DAGs themselves use kafka:29092 directly). pgs_db needs the
    # separate interpreter /opt/etl-venv/bin/python (see ETL/Dockerfile).
    DATABASE_URL: postgresql+psycopg://pgs_etl:${PGS_ETL_DB_PASSWORD:?set PGS_ETL_DB_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-pgs}
    DB_APPLICATION_NAME: pgs-airflow
    KAFKA_BROKERS: kafka:29092
    OPENSEARCH_HOST: opensearch
    OPENSEARCH_PORT: "9200"
    # spark/security_scanner.py streams every intake file to ClamAV and rejects it when
    # the scan cannot run; spark/transform.py embeds text with this model.
    CLAMD_HOST: clamav
    CLAMD_PORT: "3310"
    EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-sentence-transformers/LaBSE}
  # Live-editable DAGs/code and the local DFS stand-in, as in the former
  # ETL/airflow/docker-compose.yaml (paths now relative to the repository root).
  volumes:
    - ./ETL/airflow/dags:/opt/airflow/dags
    - ./ETL/airflow/logs:/opt/airflow/logs
    - ./ETL/airflow/plugins:/opt/airflow/plugins
    - ./ETL/airflow/config:/opt/airflow/config
    - ./ETL/airflow/data:/opt/airflow/data
    - ./ETL/spark:/opt/airflow/spark_lib:ro
    # Hugging Face cache, so the LaBSE model (~1.8 GB) downloads once.
    - etl-models:/home/airflow/.cache/huggingface
  # Set AIRFLOW_UID to your WSL/Linux user id (`id -u`) so files written to the bind
  # mounts above (logs) belong to you.
  user: "${AIRFLOW_UID:-50000}:0"

x-airflow-depends: &airflow-depends
  airflow-db:
    condition: service_healthy
  redis:
    condition: service_healthy
  airflow-init:
    condition: service_completed_successfully

services:
  # =================================================================================
  # PostgreSQL 16 + PostGIS + pgvector (database/Dockerfile)
  # =================================================================================
  postgres:
    build:
      context: ./database
      dockerfile: Dockerfile
    image: pgs-search-engine/postgres:local
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pgs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-pgs}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # Published for host-side tooling (database tests, psql, GUI clients).
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    shm_size: 256m
    healthcheck:
      # Over TCP: during first-time init the entrypoint's temporary server only
      # listens on the Unix socket, so this does not report ready too early.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  # ---------------------------------------------------------------------------------
  # One-shot database tasks (exit 0 when done; re-run, idempotently, on every `up`)
  # ---------------------------------------------------------------------------------
  db-migrate:
    <<: *hardening
    build:
      context: ./database
      dockerfile: migrate.Dockerfile
    image: pgs-search-engine/db-migrate:local
    # Default command: python -m alembic upgrade head (schema, extensions, roles).
    # Runs as the schema owner; services never do.
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-pgs}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pgs}
      DB_APPLICATION_NAME: pgs-db-migrate
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  db-seed:
    <<: *hardening
    build:
      context: ./database
      dockerfile: migrate.Dockerfile
    image: pgs-search-engine/db-migrate:local
    # Reference data the services need (7 provinces, 77 districts, 753 local bodies)
    # and their map boundaries. Both scripts upsert, so re-running is safe.
    command: ["sh", "-c", "python scripts/seed_geography.py && python scripts/seed_boundaries.py"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-pgs}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pgs}
      DB_APPLICATION_NAME: pgs-db-seed
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    restart: "no"

  db-role-passwords:
    build:
      context: ./database
      dockerfile: Dockerfile
    image: pgs-search-engine/postgres:local
    # Gives the service roles the migrations created a login password
    # (database/sql/set-role-passwords.sql, baked into the image).
    entrypoint: ["psql"]
    command:
      - --host=postgres
      - --username=${POSTGRES_USER:-pgs}
      - --dbname=${POSTGRES_DB:-pgs}
      - --no-psqlrc
      - --quiet
      - --file=/opt/pgs/set-role-passwords.sql
    user: postgres
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGS_API_DB_PASSWORD: ${PGS_API_DB_PASSWORD:?set PGS_API_DB_PASSWORD in .env}
      PGS_ETL_DB_PASSWORD: ${PGS_ETL_DB_PASSWORD}
      PGS_SEARCH_DB_PASSWORD: ${PGS_SEARCH_DB_PASSWORD:?set PGS_SEARCH_DB_PASSWORD in .env}
      PGS_SCRAPER_DB_PASSWORD: ${PGS_SCRAPER_DB_PASSWORD:?set PGS_SCRAPER_DB_PASSWORD in .env}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    restart: "no"

  # =================================================================================
  # OpenSearch (security plugin disabled for local development; reachable only from the
  # Docker network and 127.0.0.1). 2.19 is the newest line both indexes work on: the
  # ETL index (ETL/OpenSearch) uses the nmslib k-NN engine, which OpenSearch 3.x refuses
  # for new indexes; the search engine's own index works on 2.x and 3.x alike.
  # =================================================================================
  opensearch:
    image: opensearchproject/opensearch:2.19.6
    environment:
      cluster.name: pgs-search
      node.name: opensearch
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: ${OPENSEARCH_JAVA_OPTS:--Xms512m -Xmx512m}
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - "127.0.0.1:${OPENSEARCH_PORT:-9200}:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  opensearch-dashboards:
    profiles: ["tools"]
    image: opensearchproject/opensearch-dashboards:2.19.6
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    ports:
      - "127.0.0.1:${OPENSEARCH_DASHBOARDS_PORT:-5601}:5601"
    depends_on:
      opensearch:
        condition: service_healthy
    restart: unless-stopped

  # =================================================================================
  # Kafka 3.8 in KRaft mode (one combined broker/controller, no ZooKeeper)
  #   PLAINTEXT_INTERNAL kafka:29092    containers
  #   PLAINTEXT          localhost:9092 host tools (ETL/kafka/tools scripts)
  # =================================================================================
  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:${KAFKA_PORT:-9092},PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # Single broker: every internal topic has one replica.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Persist the log in the volume below (the image default is under /tmp), formatted
      # with a fixed cluster id (the image's default value, pinned so the stored log
      # stays valid across image upgrades).
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
      KAFKA_HEAP_OPTS: ${KAFKA_HEAP_OPTS:--Xms512m -Xmx512m}
    volumes:
      - kafka-data:/var/lib/kafka/data
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:9092"
    healthcheck:
      test: ["CMD-SHELL", "KAFKA_HEAP_OPTS=-Xmx128m /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 20s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:3.8.0
    # The topics the code uses: scraper -> ETL consumer (crawled-documents) and the
    # "file ready" signal the etl_ingestion_pipeline DAG polls (scraped_files_topic).
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        for topic in crawled-documents scraped_files_topic; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 \
            --create --if-not-exists --topic "$$topic" \
            --partitions 1 --replication-factor 1
        done
    environment:
      KAFKA_HEAP_OPTS: -Xmx128m
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"

  # =================================================================================
  # API gateway (api/Dockerfile)
  # =================================================================================
  api:
    <<: *hardening
    build:
      context: .
      dockerfile: api/Dockerfile
    image: pgs-search-engine/api:local
    environment:
      DATABASE_URL: postgresql+psycopg://pgs_api:${PGS_API_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-pgs}
      DB_APPLICATION_NAME: pgs-api
      SEARCH_GRPC_HOST: search-engine
      SEARCH_GRPC_PORT: "50051"
      OPENSEARCH_HOST: opensearch
      OPENSEARCH_PORT: "9200"
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db-seed:
        condition: service_completed_successfully
      db-role-passwords:
        condition: service_completed_successfully
      opensearch:
        condition: service_healthy
      # Only with the `search` profile; the gRPC channel connects lazily.
      search-engine:
        condition: service_started
        required: false
    restart: unless-stopped

  # =================================================================================
  # UI (ui/Dockerfile) -- profile `ui`
  # =================================================================================
  ui:
    <<: *hardening
    profiles: ["ui"]
    build:
      context: ./ui
      args:
        # Build-time: inlined into the browser bundle; a host URL, not a service name.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    image: pgs-search-engine/ui:local
    ports:
      - "127.0.0.1:${UI_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  # =================================================================================
  # ETL: Kafka consumer, ClamAV, Airflow (CeleryExecutor), tools
  # =================================================================================
  clamav:
    image: clamav/clamav:1.4
    # The image's own healthcheck (clamdcheck.sh) allows 6 minutes for the first
    # signature download; the volume keeps the signatures across restarts.
    volumes:
      - clamav-db:/var/lib/clamav
    # Published for running spark/test_security_scanner.py on the host (CLAMD_HOST=localhost).
    ports:
      - "127.0.0.1:${CLAMAV_PORT:-3310}:3310"
    restart: unless-stopped

  etl-consumer:
    <<: [*etl-build, *hardening]
    # kafka/consumer.py with the pgs-db interpreter, so the PostgreSQL write path
    # (pgs_db.etl) can be used from it. dumb-init (from the Airflow image) is PID 1 and
    # forwards SIGTERM, which the consumer handles before committing offsets.
    entrypoint: ["/usr/bin/dumb-init", "--"]
    command: ["/opt/etl-venv/bin/python", "consumer.py", "consume"]
    working_dir: /opt/etl/kafka
    environment:
      KAFKA_BROKERS: kafka:29092
      KAFKA_TOPIC: crawled-documents
      KAFKA_GROUP: search-engine-etl-v1
      ETL_DATABASE: /data/etl.sqlite3
      DATABASE_URL: postgresql+psycopg://pgs_etl:${PGS_ETL_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-pgs}
      DB_APPLICATION_NAME: pgs-etl-consumer
      OPENSEARCH_HOST: opensearch
      OPENSEARCH_PORT: "9200"
    volumes:
      - etl-data:/data
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      db-seed:
        condition: service_completed_successfully
      db-role-passwords:
        condition: service_completed_successfully
    restart: unless-stopped

  etl-spark-test:
    <<: [*etl-build, *hardening]
    profiles: ["tools"]
    # Formerly `docker build ETL/spark && docker run`: runs test_spark.py once.
    entrypoint: ["/usr/bin/dumb-init", "--"]
    command: ["python", "test_spark.py"]
    working_dir: /opt/airflow/spark_lib
    restart: "no"

  ingestion-signal-publisher:
    <<: [*etl-build, *hardening]
    profiles: ["tools"]
    # Publishes one file-ready signal (ETL/airflow/data/local_dfs_store/sample.html) for
    # the etl_ingestion_pipeline DAG: `docker compose run --rm ingestion-signal-publisher`.
    entrypoint: ["/usr/bin/dumb-init", "--"]
    command:
      - python
      - -c
      - |
        from kafka import KafkaProducer
        import json

        signal = {
            "bucket": "etl-file-store",
            "object_key": "sample.html",
            "target_domain": "example.gov.np",
            "source_url": "https://example.gov.np/notices/sample",
            "title": "Sample Municipality Notice",
            "content_type": "text/html",
        }
        producer = KafkaProducer(
            bootstrap_servers=["kafka:29092"],
            key_serializer=lambda key: key.encode("utf-8"),
            value_serializer=lambda value: json.dumps(value).encode("utf-8"),
        )
        producer.send("scraped_files_topic", key=signal["target_domain"], value=signal)
        producer.flush()
        print("Sent 1 file-ready ingestion signal to scraped_files_topic")
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: "no"

  opensearch-indexer:
    <<: [*etl-build, *hardening]
    profiles: ["tools"]
    # Bulk-indexes the DAG's JSONL output (ETL/airflow/data/processed/) into OpenSearch:
    # `docker compose run --rm opensearch-indexer`.
    entrypoint: ["/usr/bin/dumb-init", "--"]
    command: ["/opt/etl-venv/bin/python", "-m", "opensearch.index_documents"]
    working_dir: /opt/etl/OpenSearch
    environment:
      OPENSEARCH_URL: http://opensearch:9200
      OPENSEARCH_INDEX: ${ETL_OPENSEARCH_INDEX:-pgs_documents}
      JSONL_PATH: /data/processed/transformed_documents.jsonl
    volumes:
      - ./ETL/airflow/data:/data:ro
    depends_on:
      opensearch:
        condition: service_healthy
    restart: "no"

  airflow-db:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      POSTGRES_DB: airflow
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7.4
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        airflow db migrate
        airflow users create \
          --username "$${AIRFLOW_ADMIN_USERNAME}" \
          --password "$${AIRFLOW_ADMIN_PASSWORD}" \
          --firstname Air \
          --lastname Flow \
          --role Admin \
          --email admin@example.com || true
    environment:
      <<: *airflow-env
      AIRFLOW_ADMIN_USERNAME: ${AIRFLOW_ADMIN_USERNAME:-airflow}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?set AIRFLOW_ADMIN_PASSWORD in .env}
    depends_on:
      airflow-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "127.0.0.1:${AIRFLOW_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on: *airflow-depends
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on: *airflow-depends
    restart: unless-stopped

  airflow-worker:
    <<: *airflow-common
    command: celery worker
    environment:
      <<: *airflow-env
      # Lets the Celery worker shut down warmly (finish running tasks) on SIGTERM.
      DUMB_INIT_SETSID: "0"
    healthcheck:
      test: ["CMD-SHELL", "celery --app airflow.providers.celery.executors.celery_executor.app inspect ping -d \"celery@$${HOSTNAME}\""]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 60s
    depends_on:
      <<: *airflow-depends
      # etl_ingestion_pipeline polls Kafka and scans files with ClamAV (which may still
      # be downloading signatures; DAG runs are triggered manually).
      kafka-init:
        condition: service_completed_successfully
      clamav:
        condition: service_started
      db-role-passwords:
        condition: service_completed_successfully
    restart: unless-stopped

  # =================================================================================
  # Search engine core (search-engine/Dockerfile) -- profile `search`
  # =================================================================================
  search-index-init:
    <<: *hardening
    profiles: ["search"]
    build:
      context: .
      dockerfile: search-engine/Dockerfile
    image: pgs-search-engine/search-engine:local
    # Creates the OpenSearch index with its mapping; a no-op when it already exists.
    command: ["python", "scripts/create_index.py"]
    environment:
      OPENSEARCH_HOST: opensearch
      OPENSEARCH_PORT: "9200"
      OPENSEARCH_INDEX: ${OPENSEARCH_INDEX:-np_web_pages}
    depends_on:
      opensearch:
        condition: service_healthy
    restart: "no"

  search-engine:
    <<: *hardening
    profiles: ["search"]
    build:
      context: .
      dockerfile: search-engine/Dockerfile
    image: pgs-search-engine/search-engine:local
    environment:
      SEARCH_GRPC_HOST: 0.0.0.0
      SEARCH_GRPC_PORT: "50051"
      OPENSEARCH_HOST: opensearch
      OPENSEARCH_PORT: "9200"
      OPENSEARCH_INDEX: ${OPENSEARCH_INDEX:-np_web_pages}
      # vector_search/config.py (psycopg2) and pgs_db (DATABASE_URL), both as pgs_search
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-pgs}
      POSTGRES_USER: pgs_search
      POSTGRES_PASSWORD: ${PGS_SEARCH_DB_PASSWORD}
      DATABASE_URL: postgresql+psycopg://pgs_search:${PGS_SEARCH_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-pgs}
      DB_APPLICATION_NAME: pgs-search
    volumes:
      # Hugging Face model cache, so the models download once, not on every start.
      - search-models:/home/app/.cache/huggingface
    # Published for search-engine/scripts/test_grpc_client.py (localhost:50051).
    ports:
      - "127.0.0.1:${SEARCH_GRPC_PORT:-50051}:50051"
    depends_on:
      search-index-init:
        condition: service_completed_successfully
      db-role-passwords:
        condition: service_completed_successfully
    restart: unless-stopped

  # =================================================================================
  # Scraper (scraper/Dockerfile, one target per binary) -- profile `scraper`
  #
  # The worker uploads each crawled page (complete HTML + metadata) to S3 -- LocalStack
  # here -- and, with KAFKA_BROKERS set, also publishes it to `crawled-documents` for
  # the ETL consumer. It never writes PostgreSQL: the pgs-db migrations own the schema,
  # and scraper/migrations is not applied.
  # =================================================================================
  temporal-db:
    profiles: ["scraper", "scraper-sharded", "scraper-cli"]
    image: postgres:16-alpine
    # Temporal's own persistence (auto-setup creates its schemas), kept apart from the
    # application database.
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: ${TEMPORAL_DB_PASSWORD:?set TEMPORAL_DB_PASSWORD in .env}
      POSTGRES_DB: temporal
    volumes:
      - temporal-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U temporal -d temporal"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  temporal:
    profiles: ["scraper", "scraper-sharded", "scraper-cli"]
    image: temporalio/auto-setup:1.24.2
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${TEMPORAL_DB_PASSWORD}
      POSTGRES_SEEDS: temporal-db
    # Published for running cmd/scraper or cmd/worker on the host.
    ports:
      - "127.0.0.1:${TEMPORAL_PORT:-7233}:7233"
    healthcheck:
      # Healthy once the `default` namespace the worker and client use exists (the
      # image's setup creates it after the server is up). The frontend binds to the
      # container's IP, not localhost.
      test: ["CMD-SHELL", "temporal operator namespace describe --namespace default --address $$(hostname -i):7233 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    depends_on:
      temporal-db:
        condition: service_healthy
    restart: unless-stopped

  temporal-ui:
    profiles: ["scraper", "scraper-sharded"]
    image: temporalio/ui:2.31.2
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:${TEMPORAL_UI_PORT:-8233}
    ports:
      - "127.0.0.1:${TEMPORAL_UI_PORT:-8233}:8080"
    depends_on:
      temporal:
        condition: service_healthy
    restart: unless-stopped
  s3:
    profiles: ["scraper", "scraper-sharded", "scraper-cli"]
    image: localstack/localstack:3.8
    # S3 only; scraper/docker/init-s3-bucket.sh creates the `crawled-pages` bucket.
    # LocalStack keeps no state across restarts. For real S3, drop S3_ENDPOINT and the
    # test credentials from the scraper services.
    environment:
      SERVICES: s3
    volumes:
      - ./scraper/docker/init-s3-bucket.sh:/etc/localstack/init/ready.d/init-s3-bucket.sh:ro
    # Published for host tools (aws --endpoint-url http://localhost:4566 ..., pgs_db.ingest).
    ports:
      - "127.0.0.1:${S3_PORT:-4566}:4566"
    healthcheck:
      test: ["CMD-SHELL", "awslocal s3 ls s3://crawled-pages"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  s3-browser:
    profiles: ["scraper", "scraper-sharded"]
    image: cloudlena/s3manager:v0.11.0
    # Browse the bucket: open crawled-pages, then html/<host>/.
    environment:
      ENDPOINT: s3:4566
      REGION: us-east-1
      ACCESS_KEY_ID: test
      SECRET_ACCESS_KEY: test
      USE_SSL: "false"
    ports:
      - "127.0.0.1:${S3_BROWSER_PORT:-8081}:8080"
    depends_on:
      s3:
        condition: service_healthy
    restart: unless-stopped

  chrome:
    profiles: ["scraper", "scraper-sharded"]
    image: chromedp/headless-shell:151.0.7922.109
    # Renders JavaScript-built pages for the workers (--render=auto); internal only.
    shm_size: 1gb
    restart: unless-stopped

  scraper-worker: &scraper-worker
    <<: *hardening
    profiles: ["scraper"]
    build:
      context: ./scraper
      target: worker
    image: pgs-search-engine/scraper-worker:local
    # The worker's flags, as environment variables of the same name. Scale with
    # `docker compose up -d --scale scraper-worker=N`: replicas share the Temporal task
    # queue and load-balance automatically. MAX_CONCURRENT_ACTIVITIES is left to the
    # binary's default (NumCPU * 100, honouring the container's CPU limit).
    environment: &scraper-worker-env
      TEMPORAL_ADDRESS: temporal:7233
      STORAGE: ${SCRAPER_STORAGE:-s3}
      RENDER: ${SCRAPER_RENDER:-auto}
      CHROME_URL: ws://chrome:9222
      S3_BUCKET: crawled-pages
      S3_ENDPOINT: http://s3:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      # Also publish every document to Kafka for the ETL consumer; set
      # SCRAPER_KAFKA_BROKERS= (empty) in .env to write S3 only.
      KAFKA_BROKERS: ${SCRAPER_KAFKA_BROKERS-kafka:29092}
      KAFKA_TOPIC: crawled-documents
    depends_on: &scraper-worker-depends
      temporal:
        condition: service_healthy
      s3:
        condition: service_healthy
      chrome:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # Host-sharded workers (instead of one scaled worker): each host's fetches are routed
  # to one of three shard queues, and each worker owns one shard, so a host is only ever
  # fetched -- rate-limited, robots-checked, DNS-cached -- by a single container. Start
  # crawls with `--task-queue-shards=3`.
  scraper-worker-shard-0:
    <<: *scraper-worker
    profiles: ["scraper-sharded"]
    environment:
      <<: *scraper-worker-env
      TASK_QUEUE_SHARDS: "3"
      SHARD_INDEX: "0"
      METRICS_ADDRESS: ""
  scraper-worker-shard-1:
    <<: *scraper-worker
    profiles: ["scraper-sharded"]
    environment:
      <<: *scraper-worker-env
      TASK_QUEUE_SHARDS: "3"
      SHARD_INDEX: "1"
      METRICS_ADDRESS: ""
  scraper-worker-shard-2:
    <<: *scraper-worker
    profiles: ["scraper-sharded"]
    environment:
      <<: *scraper-worker-env
      TASK_QUEUE_SHARDS: "3"
      SHARD_INDEX: "2"
      METRICS_ADDRESS: ""

  scraper-api:
    <<: *hardening
    profiles: ["scraper", "scraper-sharded"]
    build:
      context: ./scraper
      target: api
    image: pgs-search-engine/scraper-api:local
    # Read-only documents API + Swagger UI (http://localhost:8082/docs) over the bucket.
    environment:
      S3_BUCKET: crawled-pages
      S3_ENDPOINT: http://s3:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    ports:
      - "127.0.0.1:${SCRAPER_API_PORT:-8082}:8080"
    depends_on:
      s3:
        condition: service_healthy
    restart: unless-stopped

  scraper-cli:
    <<: *hardening
    profiles: ["scraper-cli"]
    build:
      context: ./scraper
      target: cli
    image: pgs-search-engine/scraper-cli:local
    # One-shot client that starts a crawl, e.g.
    #   docker compose run --rm scraper-cli --seeds=https://example.gov.np
    #   docker compose run --rm scraper-cli --seeds-file=/configs/seeds.example.txt
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    volumes:
      - ./scraper/configs:/configs:ro
    depends_on:
      temporal:
        condition: service_healthy
    restart: "no"

volumes:
  postgres-data:
  opensearch-data:
  kafka-data:
  airflow-db-data:
  etl-data:
  search-models:
  etl-models:
  clamav-db:
  temporal-db-data:
